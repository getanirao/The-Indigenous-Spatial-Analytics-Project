name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      min_year:
        description: Window start year (contact cutoff)
        default: "1492"
      max_year:
        description: Window end year, blank for open-ended
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache upstream dataset
        uses: actions/cache@v4
        with:
          path: data/raw
          key: cliopatria-v0.2.0

      - name: Fetch Cliopatria
        run: python pipeline/fetch_cliopatria.py

      - name: Fetch US cessions
        continue-on-error: true
        run: python pipeline/fetch_tribal_cessions.py

      - name: Build site dataset
        env:
          MIN_YEAR: ${{ inputs.min_year || '1492' }}
          MAX_YEAR: ${{ inputs.max_year }}
        run: |
          args=(--min-year "$MIN_YEAR" --report)
          if [ -n "$MAX_YEAR" ]; then args+=(--max-year "$MAX_YEAR"); fi
          python pipeline/build_site_data.py "${args[@]}"

      - name: Export Commons-ready SVGs
        continue-on-error: true
        run: python pipeline/export_svg.py --top 25

      - name: Upload SVG bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commons-svg
          path: dist/svg
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
