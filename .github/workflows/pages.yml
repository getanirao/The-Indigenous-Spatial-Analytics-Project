name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache upstream dataset
        uses: actions/cache@v4
        with:
          path: data/raw
          key: royce-cessions-2018-states-50m-terrain

      - name: Fetch US cessions
        run: python pipeline/fetch_tribal_cessions.py

      - name: Fetch US state outlines
        run: python pipeline/fetch_us_states.py

      - name: Build site dataset
        run: python pipeline/build_site_data.py --report

      - name: Render relief sheets
        run: python pipeline/build_terrain.py --all

      - name: Export Commons-ready SVGs
        continue-on-error: true
        run: python pipeline/export_svg.py --top 25

      - name: Upload SVG bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commons-svg
          path: dist/svg
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
